name: "Publish Cross-Platform Release"

on:
  push:
    tags:
      - 'v*' # Se déclenche automatiquement quand vous poussez un tag (ex: v1.0.0)

jobs:
  publish-release:
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Étape spécifique à Linux pour installer les dépendances système WebKitGTK
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      # Compilation et ajout des binaires à la release GitHub (mode Brouillon)
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: "Consultez les notes de version ci-dessous pour découvrir les nouveautés."
          releaseDraft: true # La release est créée en mode brouillon pour que vous écriviez vos notes
          prerelease: false
          args: ${{ matrix.args }}