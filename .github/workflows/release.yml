name: "Publish Cross-Platform Release"

on:
  push:
    tags:
      - 'v*' # Tag push (e.g. v1.0.0)

permissions:
  contents: write

jobs:
  # Create the draft release once, with the changelog as its body. tauri-action
  # never updates an existing release, so letting both matrix jobs create it
  # made the body depend on which platform finished first.
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git-cliff needs the full history

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Generate changelog
        run: git cliff --latest --strip header > CHANGELOG.md

      - name: Create or update the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # Draft releases are not returned by the releases/tags endpoint, so list them.
          find_id() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq "map(select(.tag_name == \"$tag\" and .draft)) | .[0].id"
          }
          id=$(find_id)
          if [ "$id" = "null" ] || [ -z "$id" ]; then
            gh release create "$tag" \
              --draft \
              --prerelease \
              --title "Release $tag" \
              --notes-file CHANGELOG.md
            id=$(find_id)
          else
            # Re-run for the same tag: refresh the notes of the existing draft.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f "body=$(cat CHANGELOG.md)" > /dev/null
          fi
          if [ "$id" = "null" ] || [ -z "$id" ]; then
            echo "Draft release for $tag not found after creation." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # System libraries Tauri needs on Linux (WebKitGTK, etc.) plus what the
      # AppImage bundler requires (libfuse2 to run linuxdeploy, patchelf).
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install npm dependencies
        run: npm install

      # Build the bundles and upload them to the draft release created above.
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}
