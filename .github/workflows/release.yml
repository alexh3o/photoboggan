name: "Publish Cross-Platform Release"

on:
  push:
    tags:
      - 'v*' # Tag push (e.g. v1.0.0)

permissions:
  contents: write

jobs:
  # Create the draft release once, with the changelog as its body. tauri-action
  # never updates an existing release, so letting both matrix jobs create it
  # made the body depend on which platform finished first.
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git-cliff needs the full history

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Generate changelog
        run: git cliff --latest --strip header > CHANGELOG.md

      - name: Create or update the draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # `gh release view` is GraphQL-backed and finds drafts by tag, unlike
          # the REST releases/tags endpoint. Reuse a draft left by a previous run.
          id=$(gh release view "$tag" --json databaseId,isDraft \
            --jq 'select(.isDraft) | .databaseId' 2>/dev/null || true)
          if [ -n "$id" ]; then
            # Re-run for the same tag: refresh the notes of the existing draft.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f "body=$(cat CHANGELOG.md)" > /dev/null
          else
            # Read the id from the creation response: the releases list is
            # eventually consistent and a fresh draft can be missing from it.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f name="Release $tag" \
              -f body="$(cat CHANGELOG.md)" \
              -F draft=true \
              -F prerelease=true \
              --jq '.id')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # System libraries Tauri needs on Linux (WebKitGTK, etc.) plus what the
      # AppImage bundler requires (libfuse2 to run linuxdeploy, patchelf).
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf

      - name: Install npm dependencies
        run: npm install

      # Build the bundles and upload them to the draft release created above.
      # On Linux, tauri-action builds and uploads .deb and .AppImage directly.
      # On Windows, tauri-wrapper.mjs merges per-language MSIs into a single
      # multi-language MSI and removes the per-language files, which would make
      # tauri-action fail with "No artifacts were found".
      - name: Build and Release Tauri App (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}

      - name: Build Tauri App (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Upload Windows MSI artifacts
        if: matrix.platform == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msiDir = "src-tauri/target/release/bundle/msi"
          $files = @(Get-ChildItem -Path $msiDir -File | Where-Object { $_.Name -like "*.msi" -or $_.Name -like "*.msi.sig" })
          if ($files.Count -eq 0) {
            throw "No MSI artifacts found in $msiDir"
          }
          # `gh release upload <tag>` uses the REST tags endpoint, which cannot find draft releases.
          # Upload directly to the draft release ID via the GitHub Releases API instead.
          $repo = "${{ github.repository }}"
          $releaseId = "${{ needs.create-release.outputs.release_id }}"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $existing = @(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/$releaseId/assets" -Headers $headers)
          foreach ($file in $files) {
            $match = $existing | Where-Object { $_.name -eq $file.Name }
            if ($match) {
              Invoke-RestMethod -Method Delete -Uri "https://api.github.com/repos/$repo/releases/assets/$($match.id)" -Headers $headers | Out-Null
            }
            Write-Host "Uploading $($file.Name)..."
            Invoke-RestMethod -Method Post `
              -Uri "https://uploads.github.com/repos/$repo/releases/$releaseId/assets?name=$([uri]::EscapeDataString($file.Name))" `
              -Headers $headers `
              -ContentType "application/octet-stream" `
              -InFile $file.FullName | Out-Null
          }
