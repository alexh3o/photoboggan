name: "Publish Cross-Platform Release"

on:
  push:
    tags:
      - 'v*' # Se déclenche quand vous poussez un tag (ex: v1.0.0)

jobs:
  publish-release:
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles deb'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Nécessaire pour que git-cliff récupère tout l'historique

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Installation directe de git-cliff via Cargo (uniquement sur Linux)
      - name: Install git-cliff
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo install git-cliff

      # Génération du Changelog et stockage dans une variable d'environnement GitHub
      - name: Generate Changelog
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          changelog=$(git cliff --latest --strip header)
          {
            echo 'content<<EOF'
            echo "$changelog"
            echo 'EOF'
          } >> $GITHUB_ENV

      # Installation des dépendances système pour Linux (WebKitGTK, etc.)
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      # Compilation et publication en mode Draft (Brouillon) avec les binaires joints
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: ${{ matrix.platform == 'ubuntu-22.04' && env.content || 'Release for Windows' }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
          # Ajout du suffixe beta uniquement pour la version Linux (deb)
          appVersion: ${{ matrix.platform == 'ubuntu-22.04' && format('{0}-beta', github.ref_name) || '' }}