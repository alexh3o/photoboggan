name: "Publish Cross-Platform Release"

on:
  push:
    tags:
      - 'v*' # Se déclenche automatiquement quand vous poussez un tag (ex: v1.0.0)

jobs:
  publish-release:
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Nécessaire pour que git-cliff récupère tout l'historique

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # Génération automatique du Changelog (uniquement sur Linux pour éviter les doublons)
      - name: Generate Changelog
        if: matrix.platform == 'ubuntu-22.04'
        uses: kenji-miyake/git-cliff-action@v2
        id: git-cliff
        with:
          args: --latest --strip header

      # Installation des dépendances système pour Linux (WebKitGTK, etc.)
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      # Compilation et publication en mode Draft (Brouillon) avec les binaires joints
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Release ${{ github.ref_name }}"
          releaseBody: ${{ matrix.platform == 'ubuntu-22.04' && steps.git-cliff.outputs.content || 'Release for Windows' }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}