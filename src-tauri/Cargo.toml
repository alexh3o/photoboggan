[package]
name = "photofile"
version = "0.1.3"
description = "Gestionnaire de photos desktop ultra-performant"
authors = ["alexh3o"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"
kamadak-exif = "0.6.1"
walkdir = "2.5.0"
rayon = "1.10.0"
chrono = "0.4.38"
tauri-plugin-dialog = "2.8.2"
